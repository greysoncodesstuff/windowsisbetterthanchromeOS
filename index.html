<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Greyson's School Unblocker</title>
<style>
  /* ===================== RESET / BASE ===================== */
  *,
  *::before,
  *::after {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
  }

  :root {
    --bg-1: #070a18;
    --bg-2: #0d1230;
    --accent: #6d5cff;
    --accent-2: #22d3ee;
    --accent-3: #ff4d9d;
    --text: #eef1ff;
    --muted: #9aa3c7;
    --glass: rgba(255, 255, 255, 0.06);
    --stroke: rgba(255, 255, 255, 0.12);
  }

  html,
  body {
    height: 100%;
  }

  body {
    font-family: "Inter", "Segoe UI", system-ui, -apple-system, sans-serif;
    background: radial-gradient(1200px 700px at 15% -10%, #1b1a52 0%, transparent 60%),
                radial-gradient(1000px 600px at 110% 110%, #0b3b4a 0%, transparent 55%),
                linear-gradient(160deg, var(--bg-1), var(--bg-2));
    color: var(--text);
    min-height: 100vh;
    display: grid;
    place-items: center;
    padding: 24px;
    overflow: hidden;
    position: relative;
  }

  /* ===================== ANIMATED BLOBS ===================== */
  .blob {
    position: fixed;
    border-radius: 50%;
    filter: blur(90px);
    opacity: 0.45;
    pointer-events: none;
    z-index: 0;
    animation: float 18s ease-in-out infinite alternate;
  }

  .blob--1 {
    width: 460px;
    height: 460px;
    background: var(--accent);
    top: -140px;
    left: -120px;
  }

  .blob--2 {
    width: 420px;
    height: 420px;
    background: var(--accent-2);
    bottom: -160px;
    right: -120px;
    animation-delay: -6s;
  }

  .blob--3 {
    width: 340px;
    height: 340px;
    background: var(--accent-3);
    top: 45%;
    left: 55%;
    opacity: 0.28;
    animation-delay: -11s;
  }

  @keyframes float {
    0%   { transform: translate3d(0, 0, 0) scale(1); }
    50%  { transform: translate3d(40px, -50px, 0) scale(1.12); }
    100% { transform: translate3d(-30px, 40px, 0) scale(0.95); }
  }

  /* ===================== GRID OVERLAY ===================== */
  .grid-overlay {
    position: fixed;
    inset: 0;
    z-index: 0;
    pointer-events: none;
    background-image:
      linear-gradient(rgba(255, 255, 255, 0.035) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255, 255, 255, 0.035) 1px, transparent 1px);
    background-size: 64px 64px;
    mask-image: radial-gradient(circle at 50% 45%, #000 0%, transparent 75%);
    -webkit-mask-image: radial-gradient(circle at 50% 45%, #000 0%, transparent 75%);
  }

  /* ===================== CARD ===================== */
  .card {
    position: relative;
    z-index: 2;
    width: min(560px, 100%);
    padding: 54px 42px 46px;
    text-align: center;
    border-radius: 28px;
    background: linear-gradient(180deg, rgba(255, 255, 255, 0.09), rgba(255, 255, 255, 0.03));
    border: 1px solid var(--stroke);
    backdrop-filter: blur(22px) saturate(150%);
    -webkit-backdrop-filter: blur(22px) saturate(150%);
    box-shadow:
      0 30px 80px rgba(0, 0, 0, 0.55),
      inset 0 1px 0 rgba(255, 255, 255, 0.18);
    animation: cardIn 0.8s cubic-bezier(0.2, 0.8, 0.2, 1) both;
  }

  @keyframes cardIn {
    from { opacity: 0; transform: translateY(26px) scale(0.97); }
    to   { opacity: 1; transform: translateY(0) scale(1); }
  }

  /* Glowing top hairline */
  .card::before {
    content: "";
    position: absolute;
    top: 0;
    left: 12%;
    right: 12%;
    height: 1px;
    background: linear-gradient(90deg, transparent, var(--accent-2), var(--accent), transparent);
    opacity: 0.85;
  }

  /* ===================== BADGE ===================== */
  .badge {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 7px 15px;
    border-radius: 999px;
    font-size: 12px;
    font-weight: 600;
    letter-spacing: 0.09em;
    text-transform: uppercase;
    color: #c9d3ff;
    background: rgba(109, 92, 255, 0.16);
    border: 1px solid rgba(109, 92, 255, 0.4);
    margin-bottom: 26px;
  }

  .dot {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: #38f8a5;
    box-shadow: 0 0 10px #38f8a5;
    animation: pulse 1.8s ease-in-out infinite;
  }

  @keyframes pulse {
    0%, 100% { opacity: 1; transform: scale(1); }
    50%      { opacity: 0.45; transform: scale(0.82); }
  }

  /* ===================== HEADINGS ===================== */
  h1 {
    font-size: clamp(1.75rem, 5.2vw, 2.6rem);
    line-height: 1.16;
    font-weight: 800;
    letter-spacing: -0.025em;
    margin-bottom: 16px;
    background: linear-gradient(105deg, #ffffff 8%, #b9c4ff 42%, #6fe6ff 78%, #ffffff 100%);
    background-size: 220% auto;
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
    animation: shine 7s linear infinite;
  }

  @keyframes shine {
    to { background-position: 220% center; }
  }

  .subtitle {
    font-size: 1.02rem;
    color: var(--muted);
    letter-spacing: 0.01em;
    margin-bottom: 38px;
  }

  /* ===================== BUTTON ===================== */
  .btn-exploits {
    position: relative;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 11px;
    width: 100%;
    max-width: 340px;
    padding: 18px 34px;
    font-family: inherit;
    font-size: 1.06rem;
    font-weight: 700;
    letter-spacing: 0.02em;
    color: #ffffff;
    border: none;
    border-radius: 16px;
    cursor: pointer;
    background: linear-gradient(135deg, #6d5cff 0%, #8b5cf6 45%, #22d3ee 100%);
    background-size: 180% 180%;
    box-shadow:
      0 12px 34px rgba(109, 92, 255, 0.45),
      0 0 0 1px rgba(255, 255, 255, 0.14) inset;
    transition: transform 0.22s cubic-bezier(0.2, 0.8, 0.2, 1),
                box-shadow 0.28s ease,
                background-position 0.6s ease;
    overflow: hidden;
    isolation: isolate;
  }

  .btn-exploits:hover {
    transform: translateY(-3px) scale(1.022);
    background-position: 100% 50%;
    box-shadow:
      0 20px 48px rgba(109, 92, 255, 0.6),
      0 0 0 1px rgba(255, 255, 255, 0.22) inset;
  }

  .btn-exploits:active {
    transform: translateY(0) scale(0.985);
    box-shadow: 0 8px 22px rgba(109, 92, 255, 0.42);
  }

  .btn-exploits:focus-visible {
    outline: 2px solid #8ee6ff;
    outline-offset: 4px;
  }

  /* Shimmer sweep */
  .btn-exploits::after {
    content: "";
    position: absolute;
    inset: 0;
    background: linear-gradient(110deg, transparent 25%, rgba(255, 255, 255, 0.42) 50%, transparent 75%);
    transform: translateX(-120%);
    transition: transform 0.75s ease;
    z-index: -1;
  }

  .btn-exploits:hover::after {
    transform: translateX(120%);
  }

  .btn-exploits svg {
    width: 19px;
    height: 19px;
    flex-shrink: 0;
  }

  .hint {
    margin-top: 22px;
    font-size: 0.79rem;
    color: rgba(154, 163, 199, 0.72);
    letter-spacing: 0.03em;
  }

  /* ===================== MODAL ===================== */
  .overlay {
    position: fixed;
    inset: 0;
    z-index: 50;
    display: grid;
    place-items: center;
    padding: 22px;
    background: rgba(4, 6, 18, 0.72);
    backdrop-filter: blur(9px);
    -webkit-backdrop-filter: blur(9px);
    opacity: 0;
    visibility: hidden;
    transition: opacity 0.28s ease, visibility 0.28s ease;
  }

  .overlay.open {
    opacity: 1;
    visibility: visible;
  }

  .modal {
    width: min(480px, 100%);
    padding: 38px 34px 32px;
    border-radius: 24px;
    text-align: center;
    background: linear-gradient(180deg, #171b3a 0%, #10142c 100%);
    border: 1px solid rgba(255, 255, 255, 0.14);
    box-shadow:
      0 34px 90px rgba(0, 0, 0, 0.7),
      inset 0 1px 0 rgba(255, 255, 255, 0.12);
    transform: translateY(22px) scale(0.94);
    opacity: 0;
    transition: transform 0.34s cubic-bezier(0.2, 0.9, 0.25, 1.15),
                opacity 0.28s ease;
  }

  .overlay.open .modal {
    transform: translateY(0) scale(1);
    opacity: 1;
  }

  .warn-icon {
    width: 64px;
    height: 64px;
    margin: 0 auto 20px;
    display: grid;
    place-items: center;
    border-radius: 50%;
    background: radial-gradient(circle at 50% 35%, rgba(255, 193, 74, 0.28), rgba(255, 140, 60, 0.1));
    border: 1px solid rgba(255, 193, 74, 0.45);
    box-shadow: 0 0 34px rgba(255, 170, 60, 0.32);
    animation: warnPulse 2.2s ease-in-out infinite;
  }

  @keyframes warnPulse {
    0%, 100% { box-shadow: 0 0 30px rgba(255, 170, 60, 0.28); }
    50%      { box-shadow: 0 0 46px rgba(255, 170, 60, 0.55); }
  }

  .warn-icon svg {
    width: 30px;
    height: 30px;
    stroke: #ffc14a;
  }

  .modal h2 {
    font-size: 1.34rem;
    font-weight: 800;
    letter-spacing: -0.015em;
    margin-bottom: 14px;
    color: #fff;
  }

  .modal p {
    font-size: 0.95rem;
    line-height: 1.62;
    color: #aab2d8;
    margin-bottom: 28px;
  }

  .modal p strong {
    color: #ffd27a;
    font-weight: 700;
  }

  .modal-actions {
    display: flex;
    gap: 12px;
  }

  .modal-actions button {
    flex: 1;
    padding: 14px 18px;
    font-family: inherit;
    font-size: 0.95rem;
    font-weight: 700;
    border-radius: 13px;
    cursor: pointer;
    border: 1px solid transparent;
    transition: transform 0.18s ease, background 0.22s ease,
                box-shadow 0.22s ease, border-color 0.22s ease;
  }

  .modal-actions button:active {
    transform: scale(0.97);
  }

  .btn-cancel {
    background: rgba(255, 255, 255, 0.07);
    border-color: rgba(255, 255, 255, 0.16);
    color: #d5daf3;
  }

  .btn-cancel:hover {
    background: rgba(255, 255, 255, 0.13);
    border-color: rgba(255, 255, 255, 0.28);
  }

  .btn-yes {
    background: linear-gradient(135deg, #ff8a3d, #ff4d6d);
    color: #fff;
    box-shadow: 0 10px 26px rgba(255, 77, 109, 0.38);
  }

  .btn-yes:hover {
    box-shadow: 0 16px 36px rgba(255, 77, 109, 0.55);
    transform: translateY(-2px);
  }

  .modal-actions button:focus-visible {
    outline: 2px solid #8ee6ff;
    outline-offset: 3px;
  }

  /* ===================== RESPONSIVE ===================== */
  @media (max-width: 480px) {
    .card {
      padding: 40px 24px 34px;
      border-radius: 22px;
    }

    .modal {
      padding: 30px 22px 24px;
    }

    .modal-actions {
      flex-direction: column-reverse;
    }
  }

  @media (prefers-reduced-motion: reduce) {
    *,
    *::before,
    *::after {
      animation-duration: 0.001ms !important;
      animation-iteration-count: 1 !important;
      transition-duration: 0.001ms !important;
    }
  }
</style>
</head>
<body>

  <!-- Ambient background -->
  <div class="blob blob--1"></div>
  <div class="blob blob--2"></div>
  <div class="blob blob--3"></div>
  <div class="grid-overlay"></div>

  <!-- ===================== MAIN CARD ===================== -->
  <main class="card">
    <div class="badge"><span class="dot"></span> System Online</div>

    <h1>Greyson's School<br />Unblocker Page</h1>
    <p class="subtitle">pick any button</p>

    <button class="btn-exploits" id="exploitsBtn" type="button">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"
           stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"></polygon>
      </svg>
      Exploits
    </button>

    <p class="hint">Tap the button to continue</p>
  </main>

  <!-- ===================== WARNING MODAL ===================== -->
  <div class="overlay" id="overlay" role="dialog" aria-modal="true"
       aria-labelledby="modalTitle" aria-describedby="modalDesc">
    <div class="modal" id="modal">
      <div class="warn-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="2.2"
             stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M10.29 3.86 1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"></path>
          <line x1="12" y1="9" x2="12" y2="13"></line>
          <line x1="12" y1="17" x2="12.01" y2="17"></line>
        </svg>
      </div>

      <h2 id="modalTitle">Heads up!</h2>
      <p id="modalDesc">
        You are about to be redirected to <strong>Wolf Unblock</strong>.<br />
        Note: if this is blocked, put the URL in a proxy.
      </p>

      <div class="modal-actions">
        <button class="btn-cancel" id="cancelBtn" type="button">No, go back</button>
        <button class="btn-yes" id="yesBtn" type="button">Yes, continue</button>
      </div>
    </div>
  </div>

<script>
  (function () {
    "use strict";

    const TARGET_URL = "https://sites.google.com/view/wolfunblock/home?pli=1&authuser=0";

    const overlay    = document.getElementById("overlay");
    const exploitsBtn = document.getElementById("exploitsBtn");
    const cancelBtn  = document.getElementById("cancelBtn");
    const yesBtn     = document.getElementById("yesBtn");

    let lastFocused = null;

    /* ---------- Open modal ---------- */
    function openModal() {
      lastFocused = document.activeElement;
      overlay.classList.add("open");
      document.body.style.overflow = "hidden";
      // Focus the safer option first
      requestAnimationFrame(() => cancelBtn.focus());
    }

    /* ---------- Close modal ---------- */
    function closeModal() {
      overlay.classList.remove("open");
      document.body.style.overflow = "";
      if (lastFocused) lastFocused.focus();
    }

    /* ---------- Redirect ---------- */
    function redirect() {
      window.location.href = TARGET_URL;
    }

    /* ---------- Events ---------- */
    exploitsBtn.addEventListener("click", openModal);
    cancelBtn.addEventListener("click", closeModal);
    yesBtn.addEventListener("click", redirect);

    // Click on backdrop closes
    overlay.addEventListener("click", function (e) {
      if (e.target === overlay) closeModal();
    });

    // Keyboard: Esc closes, Enter confirms when modal is open
    document.addEventListener("keydown", function (e) {
      if (!overlay.classList.contains("open")) return;

      if (e.key === "Escape") {
        e.preventDefault();
        closeModal();
      }

      // Simple focus trap
      if (e.key === "Tab") {
        const focusable = [cancelBtn, yesBtn];
        const first = focusable[0];
        const last = focusable[focusable.length - 1];

        if (e.shiftKey && document.activeElement === first) {
          e.preventDefault();
          last.focus();
        } else if (!e.shiftKey && document.activeElement === last) {
          e.preventDefault();
          first.focus();
        }
      }
    });
  })();
</script>
</body>
</html>
